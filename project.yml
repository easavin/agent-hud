name: AgentHUD
options:
  bundleIdPrefix: com.agenthud
  deploymentTarget:
    macOS: "14.0"
packages:
  HUDCore:
    path: Packages/HUDCore
targets:
  AgentHUD:
    type: application
    platform: macOS
    sources: [AgentHUD]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: HUDCore
    info:
      path: AgentHUD/Info.plist
      properties:
        CFBundleDisplayName: Agent HUD
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Local, read-only monitor for Claude Code sessions.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agenthud.AgentHUD
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Reads ~/.claude, so the app cannot be sandboxed.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # Signing lives in Signing.xcconfig (ad-hoc by default, overridable locally).
